name: Check different python versions compability

on: [push, pull_request]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # ponytail: hosted setup-python dropped 2.7/3.7 from its
                    # tool cache; official python Docker images still ship
                    # them, so run those two in-container instead of via
                    # setup-python. Bump these tags when upstream retags.
                    - label: '2.7 (old py2)'
                      container: 'python:2.7'
                    - label: '3.7 (old py3)'
                      container: 'python:3.7'
                    - label: '3.13 (new py3)'
                      python-version: '3.13'
        container: ${{ matrix.container }}

        steps:
            - name: Checkout the code
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              if: matrix.python-version
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install flake8 pylint
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

            - name: Lint with flake8
              run: |
                  # stop the build if there are Python syntax errors or undefined names
                  flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
                  # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
                  flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

            - name: Run pylint
              run: |
                  pylint suid3num.py --exit-zero

            - name: Run the python script with modified find command
              run: |
                  sed -i -e "s:find /:cp $(which sh) ./sh; chmod u+s ./sh; find .:g" suid3num.py
                  python suid3num.py
